[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drsystem"
version = "0.1.0"
description = "Intelligent multi-region disaster recovery system (local simulation + AWS adapters)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.35", "botocore[crt]", "mangum>=0.19"]  # crt: needed for `aws login` sessions
dev = ["pytest>=8", "moto[s3,ssm,sns]>=5.0", "boto3>=1.35", "botocore[crt]", "mangum>=0.19"]

[project.scripts]
drsystem = "drsystem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: spins up the local multi-region simulation (slower, still $0 and offline)",
]
